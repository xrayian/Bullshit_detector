<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BS Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <svg class="brand-icon" data-icon="smell"></svg>
      <div class="brand-text">
        <h1 class="title">BS Detector</h1>
        <p class="subtitle">Social media caption BS detector</p>
      </div>
    </header>

    <div id="aiStatus" class="ai-status" role="status">
      <span class="status-icon" id="statusIcon"></span>
      <span class="status-text" id="statusText">Checking API key...</span>
    </div>

    <button class="settings-toggle" id="settingsToggle" aria-expanded="false">
      <span class="settings-label">
        <svg class="toggle-icon" data-icon="cog"></svg>
        Settings
      </span>
      <svg class="arrow" id="settingsArrow" data-icon="chevron"></svg>
    </button>

    <div class="settings-body hidden" id="settingsBody">
      <div class="setting">
        <span class="setting-label">Gemini API Key</span>
        <div class="input-wrap">
          <svg class="input-icon" data-icon="key"></svg>
          <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
          <button id="keyToggle" class="icon-btn" type="button" aria-label="Show API key"></button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Model</span>
        <div class="input-wrap">
          <svg class="input-icon" data-icon="cpu"></svg>
          <select id="modelSelect">
            <option value="gemini-3.7-flash">gemini-3.7-flash</option>
            <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
            <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
            <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
            <option value="gemini-flash-latest">gemini-flash-latest</option>
            <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
            <option value="gemini-pro-latest">gemini-pro-latest</option>
            <option value="gemini-omni-flash-preview">gemini-omni-flash-preview</option>
            <option value="__custom__">Custom…</option>
          </select>
          <svg class="select-caret" data-icon="chevron"></svg>
        </div>
        <input type="text" id="modelCustom" class="custom-model hidden" placeholder="gemini-..." autocomplete="off" />
      </div>

      <div class="setting cache-row">
        <button id="clearCacheBtn" class="btn-ghost" type="button">
          <svg data-icon="trash"></svg>
          Clear cache
        </button>
        <span id="cacheCount" class="cache-count">0 rated</span>
      </div>

      <button id="saveBtn" class="btn btn-save">Save</button>
      <div id="saveMsg" class="save-msg" role="status"></div>
    </div>

    <footer class="footer">
      <span>v4.1.0</span>
    </footer>
  </div>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
